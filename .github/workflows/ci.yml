name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes!!
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/jsonrpc_template
  CACHE_REDIS_URL: redis://127.0.0.1:6379

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: layering
        run: python3 scripts/check_layering.py
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: api default-features (otlp + blob-fs path)
        # e2e 用 --no-default-features --features blob-fs；此处保证默认 otlp+blob-fs 仍能编过
        run: cargo check -p api --all-targets

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Workspace lib + integration tests
        # 含 crates/axum_jsonrpc/tests、infra/locale/tests（seal 契约）
        run: cargo test --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jsonrpc_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install hurl
        run: |
          # hurl 仅以 deb 形式分发；升级时同步更新此 URL（https://github.com/Orange-OpenSource/hurl/releases）
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/Orange-OpenSource/hurl/releases/download/6.1.1/hurl_6.1.1_amd64.deb -o hurl.deb
          sudo dpkg -i hurl.deb
      - name: e2e
        run: just e2e
