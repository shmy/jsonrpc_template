name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes!!
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/jsonrpc_template
  CACHE_REDIS_URL: redis://127.0.0.1:6379
  # https://github.com/Orange-OpenSource/hurl/releases — bump with install step
  HURL_VERSION: "8.1.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: layering
        run: |
          python3 scripts/check_layering.py
          python3 scripts/check_module_order.py
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: biz default-features
        # e2e 关 otlp；这里覆盖默认 otlp+blob-fs
        run: cargo check -p biz --all-targets
      - name: biz blob-cos (no fs)
        # 编译期互斥：blob-cos 不得经 default-features 再拉进 blob_kit/fs
        run: |
          cargo check -p biz --no-default-features --features blob-cos --all-targets
          tree_out="$(cargo tree -p biz --no-default-features --features blob-cos -e features -i blob_kit)"
          if printf '%s\n' "$tree_out" | grep -F 'blob_kit feature "fs"'; then
            echo 'blob-cos build must not enable blob_kit feature "fs"' >&2
            printf '%s\n' "$tree_out" >&2
            exit 1
          fi
          printf '%s\n' "$tree_out" | grep -F 'blob_kit feature "cos"'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
      - name: clients-check
        run: just clients-check

  e2e:
    # hurl .deb 对齐 22.04/24.04；ubuntu-latest(=26.04) 上 libxml2 不可解
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jsonrpc_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install hurl, psql, redis-cli
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --location --remote-name \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y "./hurl_${HURL_VERSION}_amd64.deb" postgresql-client redis-tools
      - name: Build migrator + biz
        run: |
          cargo build --bin migrator
          cargo build -p biz --no-default-features --features blob-fs
      - name: e2e
        run: stdbuf -oL -eL just e2e
