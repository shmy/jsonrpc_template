# Minimal cargo-deny config; validated against this workspace's real graph
# (`cargo deny check` must pass locally before changing this file).
[advisories]
# yanked 版本可能是构建损坏也可能是撤回的安全修复，一律挡在 CI
yanked = "deny"
ignore = [
    # ---- validify 2.0 请求体校验链（上游未修复；validify 发新版即移除）----
    # idna 0.5 Punycode：仅用于请求体字段校验，服务自身无 URL 主机名授权比较场景
    "RUSTSEC-2024-0421",
    # proc-macro-error（validify_derive）：仅编译期，无运行时攻击面
    "RUSTSEC-2024-0370",
    # atomic-polyfill（phonenumber → postcard → heapless）：生产 x86_64/aarch64 二进制不含
    "RUSTSEC-2023-0089",
    # unic-* 5 个（validify 拉入）：纯 Unicode 数据表，无执行逻辑
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0101",
    # ---- 以下为本仓实测会命中的 unmaintained 告警 ----
    # chrono：仅剩传递依赖（validify / turso_ext 拉入 0.4.45）；
    # workspace 直接依赖已于 2026-11 迁移到 jiff（cache_kit 滑窗时间戳）。
    # 上游（validify / toasty）迁移后移除。
    "RUSTSEC-2026-0543",
    # rustls-pemfile：tonic（OTLP）传递依赖，仅 gRPC exporter 路径。
    "RUSTSEC-2025-0134",
]

[licenses]
# workspace 内部 crate 均标记 publish = false（模板代码禁止发布 crates.io），
# 配合 private.ignore = true 跳过其 license 检查；license 由按产品落地时决定
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# workspace 依赖全部显式 pinned（版本集中在根 Cargo.toml）；禁止 `*`，
# 但 `{ workspace = true }` 继承不算 wildcard
wildcards = "deny"
allow-workspace = true

[sources]
unknown-registry = "deny"
# 本仓无 git 依赖；收紧为 deny，防止未来私拉 git 源
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
