[package]
name = "http_server"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[features]
# blob-*：单独 check/test 本 crate 时开；组合根经 workspace
# default-features=false，由 biz → file 的 blob feature 统一。
default = ["blob-fs"]
blob-fs = ["app_state/blob-fs", "blob_kit/fs", "http_auth/blob-fs", "http_routing/blob-fs"]
blob-cos = ["app_state/blob-cos", "blob_kit/cos", "http_auth/blob-cos", "http_routing/blob-cos"]
# 由 biz feature `otlp` 开启；RPC metrics + 入站 W3C Trace Context
otel = [
    "dep:trace_kit",
    "dep:axum-tracing-opentelemetry",
    "dep:http_1",
    "trace_kit/otlp",
]

[dependencies]
modrun = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
http_routing = { workspace = true }
http_auth = { workspace = true }
axum_jsonrpc = { workspace = true }
axum_jsonrpc_openrpc = { workspace = true }
app_state = { workspace = true }
blob_kit = { workspace = true }
cache_kit = { workspace = true }
config = { workspace = true }
jwt_kit = { workspace = true }
locale = { workspace = true }
tower-http = { workspace = true }
trace_kit = { workspace = true, optional = true }
axum-tracing-opentelemetry = { workspace = true, optional = true }
http_1 = { workspace = true, optional = true }
toasty = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }

[lints]
workspace = true
