[package]
name = "file_attachment"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
# 与 app 的 blob-fs / blob-cos 对齐；workspace 依赖 default-features=false，
# 避免 blob-cos 组合根经本 crate 默认再拉进 fs。
default = ["fs"]
fs = ["blob_kit/fs"]
cos = ["blob_kit/cos"]

[dependencies]
blob_kit = { workspace = true }
cache_kit = { workspace = true }
file_contract = { workspace = true }
# staging claim 所有者主键用中立 account_id（勿再借 identity_contract）
account_id = { workspace = true }
rootcause = { workspace = true }
toasty = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# bind 单测用内存后端构造 Blob
blob_kit = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt"] }
