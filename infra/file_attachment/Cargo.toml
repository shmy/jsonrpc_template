[package]
name = "file_attachment"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
# 至少启用一个后端，便于独立 `cargo test -p file_attachment`；与 api 的 cos/fs 会 feature 统一
blob_kit = { workspace = true, features = ["fs"] }
cache_kit = { workspace = true }
file_contract = { workspace = true }
# staging claim 所有者主键用中立 account_id（勿再借 identity_contract）
account_id = { workspace = true }
rootcause = { workspace = true }
toasty = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# bind 单测用内存后端构造 Blob
blob_kit = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt"] }
