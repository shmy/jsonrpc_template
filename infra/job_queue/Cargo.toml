[package]
name = "job_queue"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = []
# 入队时从当前 OTel span 取 trace id（api `otlp` 打开）
trace = ["dep:trace_kit", "trace_kit/trace_id", "dep:http_1"]

[dependencies]
apalis = { workspace = true }
apalis-redis = { workspace = true }
blob_kit = { workspace = true, features = ["fs"] }
config = { workspace = true }
file_attachment = { workspace = true }
file_contract = { workspace = true }
http_1 = { workspace = true, optional = true }
image_kit = { workspace = true }
modrun = { workspace = true }
redis = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
trace_kit = { workspace = true, optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
blob_kit = { workspace = true, features = ["test-utils"] }
image = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
