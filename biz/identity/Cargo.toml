[package]
name = "identity"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[features]
# 叶子 `cargo check -p identity` 默认 fs；组合根经 workspace
# default-features=false，由 biz 的 blob-fs|blob-cos → file 统一打开。
default = ["blob-fs"]
blob-fs = ["app_state/blob-fs", "file_attachment/fs", "blob_kit/fs"]
blob-cos = ["app_state/blob-cos", "file_attachment/cos", "blob_kit/cos"]

[dependencies]
rootcause = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
modrun = { workspace = true }
app_state = { workspace = true }
blob_kit = { workspace = true }
config = { workspace = true }
file_attachment = { workspace = true }
http_routing = { workspace = true }
http_auth = { workspace = true }
http_extractors = { workspace = true }
axum = { workspace = true }
axum_jsonrpc = { workspace = true }
schemars = { workspace = true }
account_id = { workspace = true }
identity_contract = { workspace = true }
locale = { workspace = true }
validify = { workspace = true }
toasty = { workspace = true }
argon2 = { workspace = true }
tokio = { workspace = true }
authn_kit = { workspace = true }
cache_kit = { workspace = true }
jwt_kit = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# token_ops 单测用内存后端；避免把 MemoryCache 编进生产二进制
cache_kit = { workspace = true, features = ["memory"] }
# into_view 填 URL 用内存 Blob
blob_kit = { workspace = true, features = ["test-utils"] }
jiff = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

