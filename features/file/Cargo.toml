[package]
name = "file"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[features]
default = []
blob-fs = ["blob_kit/fs", "app_state/blob-fs", "config/fs"]
blob-cos = ["blob_kit/cos", "app_state/blob-cos", "config/cos"]

[dependencies]
app_state = { workspace = true }
axum = { workspace = true }
axum_jsonrpc = { workspace = true }
blob_kit = { workspace = true }
cache_kit = { workspace = true }
config = { workspace = true }
file_attachment = { workspace = true }
file_contract = { workspace = true }
http_auth = { workspace = true }
http_routing = { workspace = true }
tower-http = { workspace = true }
jiff = { workspace = true, features = ["std"] }
locale = { workspace = true }
mime_guess = { workspace = true }
modrun = { workspace = true }
rootcause = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
toasty = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
validify = { workspace = true }

[dev-dependencies]
blob_kit = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
